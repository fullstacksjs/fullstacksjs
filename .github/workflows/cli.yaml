name: Verify

on:
  pull_request:
    branches:
      - main
      - next

jobs:
  static-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: pnpm install
      - run: pnpm lint
